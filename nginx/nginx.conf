events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml text/xml application/rss+xml image/svg+xml font/woff2;

    client_max_body_size 50M;

    # Resolver interno do Docker: força o nginx a re-resolver o DNS dos
    # containers a cada request, evitando 502 com IP velho após recriar
    # os serviços (docker compose up --build).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # v2.4: micro-cache das páginas públicas (30 s). As páginas do site são montadas a cada
    # visita; com isso a maioria das visitas recebe a página pronta do nginx (resposta mais
    # rápida), e o site continua refletindo as mudanças do painel em até 30 s.
    # Fica dentro do container do nginx: é apagado a cada deploy (docker compose up).
    proxy_cache_path /var/cache/nginx/academypop levels=1:2 keys_zone=paginas:10m max_size=200m inactive=10m use_temp_path=off;

    # Não usa o micro-cache para quem está logado no painel nem em métodos que não sejam GET/HEAD
    map $cookie_admin_token $sem_microcache {
        ""      0;
        default 1;
    }

    # v2.4: HTML nunca fica guardado 1 ano em cache.
    # Páginas estáticas do Next saem com "s-maxage=31536000"; um cache na frente do servidor
    # (hospedagem/CDN) guardou o painel antigo por causa disso. Aqui o nginx troca esse valor
    # por "public, max-age=0, must-revalidate" (o cache precisa conferir a cada acesso).
    map $upstream_http_cache_control $html_cache_control {
        "~s-maxage=31536000"  "public, max-age=0, must-revalidate";
        default               $upstream_http_cache_control;
    }

    # Cabeçalhos de segurança (v2)
    map $http_x_forwarded_proto $hsts {
        https   "max-age=31536000";
        default "";
    }

    # v2: www.academypopeduca.com.br -> academypopeduca.com.br (evita conteúdo duplicado no Google)
    server {
        listen 80;
        server_name www.academypopeduca.com.br;
        return 301 https://academypopeduca.com.br$request_uri;
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts always;

        # Arquivos de upload (MinIO)
        location /uploads/ {
            set $minio_upstream minio:9000;
            # Com proxy_pass via variavel o nginx nao anexa o caminho
            # automaticamente; reconstruimos a URI com rewrite.
            rewrite ^/uploads/(.*)$ /academy-uploads/$1 break;
            proxy_pass http://$minio_upstream;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # API Backend
        location /api/ {
            set $backend_upstream backend:3001;
            # Remove o /api antes de encaminhar (proxy_pass via variavel
            # nao faz isso sozinho).
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }

        # v2: arquivos estáticos do Next.js têm hash no nome -> cache de 1 ano
        location /_next/static/ {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # v2.4: painel admin – nunca guardar em cache (nem navegador, nem proxy/CDN)
        location /admin {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            # add_header aqui anula os do bloco server: repetimos os de segurança
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security $hsts always;
        }

        # v2.4: imagens otimizadas do Next mantêm o cache que o próprio Next define
        location /_next/image {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # v2.4: carrinho e checkout: sempre direto no Next (sem micro-cache)
        location ~ ^/(checkout|carrinho) {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # Frontend Next.js
        location / {
            # v2.4: micro-cache (ver proxy_cache_path no topo)
            proxy_cache paginas;
            proxy_cache_key "$scheme$host$request_uri|$http_rsc|$http_next_router_prefetch";
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_bypass $sem_microcache;
            proxy_no_cache $sem_microcache;
            proxy_ignore_headers Cache-Control Expires;
            add_header X-Cache $upstream_cache_status always;
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
            # v2.4: troca o cache de 1 ano do HTML estático (ver o map no topo)
            proxy_hide_header Cache-Control;
            add_header Cache-Control $html_cache_control always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security $hsts always;
        }
    }
}
