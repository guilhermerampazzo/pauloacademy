events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml text/xml application/rss+xml image/svg+xml font/woff2;

    client_max_body_size 50M;

    # Resolver interno do Docker: força o nginx a re-resolver o DNS dos
    # containers a cada request, evitando 502 com IP velho após recriar
    # os serviços (docker compose up --build).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeçalhos de segurança (v2)
    map $http_x_forwarded_proto $hsts {
        https   "max-age=31536000";
        default "";
    }

    # v2: www.academypopeduca.com.br -> academypopeduca.com.br (evita conteúdo duplicado no Google)
    server {
        listen 80;
        server_name www.academypopeduca.com.br;
        return 301 https://academypopeduca.com.br$request_uri;
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts always;

        # Arquivos de upload (MinIO)
        location /uploads/ {
            set $minio_upstream minio:9000;
            # Com proxy_pass via variavel o nginx nao anexa o caminho
            # automaticamente; reconstruimos a URI com rewrite.
            rewrite ^/uploads/(.*)$ /academy-uploads/$1 break;
            proxy_pass http://$minio_upstream;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # API Backend
        location /api/ {
            set $backend_upstream backend:3001;
            # Remove o /api antes de encaminhar (proxy_pass via variavel
            # nao faz isso sozinho).
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }

        # v2: arquivos estáticos do Next.js têm hash no nome -> cache de 1 ano
        location /_next/static/ {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend Next.js
        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }
    }
}
